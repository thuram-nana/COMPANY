name: build-test-deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # for build provenance attestation
  attestations: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: per-URL sitemap lastmod comes from git

      - uses: actions/setup-node@v4
        with:
          node-version: 22   # html-validate 11 needs Node ^22.22 || >=24.8

      - name: Install dev tooling
        run: npm ci || npm install

      - name: Generate llms + build
        run: |
          export BUILD_DATE=$(git log -1 --format=%cs)   # deterministic across jobs
          node scripts/gen-llms.mjs
          node scripts/build.mjs

      - name: HTML validation
        run: npx html-validate "dist/**/*.html"

      - name: Accessibility (axe-core, structural)
        run: node scripts/test-a11y.mjs

      - name: Contrast check (WCAG AA, both themes)
        run: node scripts/test-contrast.mjs

      - name: Internal link check
        run: node scripts/test-links.mjs

      - name: PHP syntax check (briefing endpoint)
        run: php -l public/api/briefing.php

      - name: Lighthouse CI (mobile, all routes)
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci autorun --config=deploy/lighthouserc.json || echo "LHCI thresholds are advisory in CI"

      - name: Software bill of materials (CycloneDX)
        run: |
          npx @cyclonedx/cyclonedx-npm --output-file dist/sbom.json || true

      - name: Provenance attestation
        if: github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dist/**/*.html'

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          include-hidden-files: true   # .htaccess and .well-known/ must ship

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # One upload at a time (job-level, so every push is still built and tested).
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    # The `secrets` context is not available in a step-level `if:` (that is why
    # every earlier run of this workflow failed at startup with no jobs). Expose
    # "is this secret set?" flags through the job environment instead.
    env:
      HAS_VERCEL:     ${{ secrets.VERCEL_TOKEN != '' }}
      HAS_NAMECHEAP:  ${{ secrets.NAMECHEAP_FTP_HOST != '' && secrets.NAMECHEAP_FTP_USER != '' && secrets.NAMECHEAP_FTP_PASSWORD != '' }}
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      HAS_INDEXNOW:   ${{ secrets.INDEXNOW_KEY != '' }}
      HAS_GSC:        ${{ secrets.GSC_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # `vercel build` rebuilds; sitemap lastmod needs history
      - uses: actions/setup-node@v4
        with:
          node-version: 22   # html-validate 11 needs Node ^22.22 || >=24.8
      # Deploy exactly what build-and-test validated — not the committed dist/.
      - name: Replace committed dist/ with the tested build
        run: rm -rf dist
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy target summary
        run: |
          echo "Vercel:             $HAS_VERCEL"
          echo "Namecheap (FTPS):   $HAS_NAMECHEAP"
          echo "Cloudflare Pages:   $HAS_CLOUDFLARE"
          echo "IndexNow ping:      $HAS_INDEXNOW"
          echo "GSC sitemap submit: $HAS_GSC"
          if [ "$HAS_VERCEL" != "true" ] && [ "$HAS_NAMECHEAP" != "true" ] && [ "$HAS_CLOUDFLARE" != "true" ]; then
            echo "::warning::No deploy target configured — set VERCEL_TOKEN (or the NAMECHEAP_FTP_* / CLOUDFLARE_* secrets); see deploy/README.md §4"
          fi

      # --- Target A: Vercel (runbook §4d — the chosen host) ------------------------
      # One secret: VERCEL_TOKEN. `vercel link --yes` creates/link the project,
      # `vercel build` rebuilds from source on this runner (full git history, so
      # sitemap lastmod stays accurate) and bundles api/briefing.js, and
      # `deploy --prebuilt --prod` ships exactly that output.
      - name: Deploy to Vercel (production)
        if: env.HAS_VERCEL == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BRIEFING_SMTP_PASS: ${{ secrets.BRIEFING_SMTP_PASS }}
          RECEIPT_SECRET: ${{ secrets.RECEIPT_SECRET }}
        run: |
          export BUILD_DATE=$(git log -1 --format=%cs)   # same date stamp as the tested build
          npm i -g vercel@latest
          # The CLI never auto-selects a team without a TTY ("Multiple teams found"):
          # resolve the account's default team through the API and pass it as --scope.
          SCOPE=$(curl -sf https://api.vercel.com/v2/user -H "Authorization: Bearer $VERCEL_TOKEN" \
                  | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const j=JSON.parse(d);const u=j.user||j;process.stdout.write(u.defaultTeamId||"")})')
          if [ -z "$SCOPE" ]; then
            SCOPE=$(curl -sf https://api.vercel.com/v2/teams -H "Authorization: Bearer $VERCEL_TOKEN" \
                    | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const j=JSON.parse(d);process.stdout.write((j.teams&&j.teams[0]&&j.teams[0].id)||"")})')
          fi
          if [ -n "$SCOPE" ]; then SCOPE_ARG="--scope $SCOPE"; echo "Using Vercel scope: $SCOPE"; else SCOPE_ARG=""; fi
          vercel link --yes --project sigilsovereign $SCOPE_ARG --token "$VERCEL_TOKEN"
          vercel pull --yes --environment=production $SCOPE_ARG --token "$VERCEL_TOKEN"
          # Briefing-form SMTP settings for api/briefing.js (runbook §4d step 7):
          # synced from GitHub secrets so the whole setup lives in one place.
          # Only runs when BRIEFING_SMTP_PASS is set; values land before the deploy.
          if [ -n "$BRIEFING_SMTP_PASS" ]; then
            setenv() { vercel env rm "$1" production --yes $SCOPE_ARG --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
                       printf '%s' "$2" | vercel env add "$1" production $SCOPE_ARG --token "$VERCEL_TOKEN"; }
            setenv BRIEFING_SMTP_HOST "server402-2.web-hosting.com"
            setenv BRIEFING_SMTP_PORT "465"
            setenv BRIEFING_SMTP_USER "website@sigilsovereign.com"
            setenv BRIEFING_SMTP_PASS "$BRIEFING_SMTP_PASS"
            setenv BRIEFING_TO       "info@sigilsovereign.com"
            [ -n "$RECEIPT_SECRET" ] && setenv RECEIPT_SECRET "$RECEIPT_SECRET"
            echo "Briefing SMTP env synced to Vercel (production)"
          else
            echo "BRIEFING_SMTP_PASS secret not set — form keeps its mailto fallback for now"
          fi
          vercel build --prod --token "$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod $SCOPE_ARG --token "$VERCEL_TOKEN"
          # Best-effort domain attach TO THE PROJECT (second positional arg);
          # harmless if already attached — finish in the dashboard otherwise.
          vercel domains add sigilsovereign.com sigilsovereign $SCOPE_ARG --token "$VERCEL_TOKEN" || true
          vercel domains add www.sigilsovereign.com sigilsovereign $SCOPE_ARG --token "$VERCEL_TOKEN" || true
          # www must 308 to the apex (canonical + HSTS-preload); the CLI has no
          # flag for this, so set the project-domain redirect through the API.
          PRJ=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(".vercel/project.json","utf8")).projectId)')
          TQ=""; [ -n "$SCOPE" ] && TQ="?teamId=$SCOPE"
          curl -sf -X PATCH "https://api.vercel.com/v9/projects/$PRJ/domains/www.sigilsovereign.com$TQ" \
            -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
            -d '{"redirect":"sigilsovereign.com","redirectStatusCode":308}' >/dev/null \
            && echo "www to apex redirect (308) enforced" \
            || echo "::warning::could not set the www redirect - set it in Vercel Settings / Domains"

      - name: Smoke-test the live site (Vercel)
        if: env.HAS_VERCEL == 'true'
        run: |
          if curl -sI -m 20 https://sigilsovereign.com/ | grep -qiE '^server: *vercel'; then
            bash deploy/smoke.sh https://sigilsovereign.com
          else
            echo "::notice::sigilsovereign.com does not resolve to Vercel yet (DNS pending) — smoke test skipped; see deploy/README.md §4d for the DNS records"
          fi

      # --- Target B: Namecheap shared hosting (cPanel / LiteSpeed) over FTPS -----
      # Secrets: NAMECHEAP_FTP_HOST, NAMECHEAP_FTP_USER, NAMECHEAP_FTP_PASSWORD.
      # Variable (optional): NAMECHEAP_FTP_DIR — where the FTP login lands relative
      # to the site root. Main cPanel login → "public_html/" (default); a dedicated
      # FTP account whose directory already IS public_html → "./".
      - name: Deploy to Namecheap (FTPS → public_html)
        if: env.HAS_NAMECHEAP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.NAMECHEAP_FTP_HOST }}
          username: ${{ secrets.NAMECHEAP_FTP_USER }}
          password: ${{ secrets.NAMECHEAP_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict           # verify the server certificate (issued for *.web-hosting.com)
          local-dir: dist/
          server-dir: ${{ vars.NAMECHEAP_FTP_DIR || 'public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            _headers
            sbom.json

      - name: Smoke-test the live site (Namecheap)
        if: env.HAS_NAMECHEAP == 'true'
        run: bash deploy/smoke.sh https://sigilsovereign.com

      # --- Target C: Cloudflare Pages (runbook §4a) --------------------------------
      # The FTP action drops its state file into dist/; that and the
      # Apache/PHP-only files must not be published on Pages.
      - name: Strip Namecheap-only files before the Pages upload
        if: env.HAS_CLOUDFLARE == 'true'
        run: rm -f dist/.ftp-deploy-sync-state.json dist/.htaccess dist/fr/.htaccess dist/api/briefing.php
      - name: Deploy to Cloudflare Pages
        if: env.HAS_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=sigilsovereign

      # --- Post-deploy indexing pings (only once something was deployed) ----------
      - name: IndexNow ping (changed URLs)
        if: env.HAS_INDEXNOW == 'true' && (env.HAS_VERCEL == 'true' || env.HAS_NAMECHEAP == 'true' || env.HAS_CLOUDFLARE == 'true')
        run: node scripts/indexnow.mjs
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      - name: WebSub publish ping (instant feed discovery)
        if: env.HAS_VERCEL == 'true' || env.HAS_NAMECHEAP == 'true' || env.HAS_CLOUDFLARE == 'true'
        run: node scripts/websub-ping.mjs

      - name: Submit sitemap to Google Search Console
        if: env.HAS_GSC == 'true' && (env.HAS_VERCEL == 'true' || env.HAS_NAMECHEAP == 'true' || env.HAS_CLOUDFLARE == 'true')
        run: node scripts/gsc-submit.mjs
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
